name: Build fixed Trascrivimelo APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-fixed-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Install Gradle 8.7
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-8.7/bin' >> "$GITHUB_PATH"

      - name: Download current official Whisper tiny model
        run: |
          rm -rf /tmp/whisper app/src/main/assets
          mkdir -p /tmp/whisper app/src/main/assets/sherpa-onnx-whisper-tiny
          curl -L --fail --retry 3 \
            -o /tmp/whisper.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2
          tar -xjf /tmp/whisper.tar.bz2 -C /tmp/whisper
          MODEL_DIR="$(find /tmp/whisper -type d -name 'sherpa-onnx-whisper-tiny' | head -n 1)"
          test -n "$MODEL_DIR"
          cp "$MODEL_DIR/tiny-encoder.int8.onnx" app/src/main/assets/sherpa-onnx-whisper-tiny/
          cp "$MODEL_DIR/tiny-decoder.int8.onnx" app/src/main/assets/sherpa-onnx-whisper-tiny/
          cp "$MODEL_DIR/tiny-tokens.txt" app/src/main/assets/sherpa-onnx-whisper-tiny/

          ENCODER_SIZE=$(stat -c%s app/src/main/assets/sherpa-onnx-whisper-tiny/tiny-encoder.int8.onnx)
          DECODER_SIZE=$(stat -c%s app/src/main/assets/sherpa-onnx-whisper-tiny/tiny-decoder.int8.onnx)
          TOKENS_SIZE=$(stat -c%s app/src/main/assets/sherpa-onnx-whisper-tiny/tiny-tokens.txt)
          echo "encoder=$ENCODER_SIZE decoder=$DECODER_SIZE tokens=$TOKENS_SIZE"
          test "$ENCODER_SIZE" -gt 10000000
          test "$DECODER_SIZE" -gt 80000000
          test "$TOKENS_SIZE" -gt 700000
          ls -lh app/src/main/assets/sherpa-onnx-whisper-tiny/

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Trascrivi_Offline_v1.4_FIX.apk
          sha256sum dist/Trascrivi_Offline_v1.4_FIX.apk | tee dist/SHA256.txt
          ls -lh dist/Trascrivi_Offline_v1.4_FIX.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trascrivi-Offline-v1.4-FIX
          path: |
            dist/Trascrivi_Offline_v1.4_FIX.apk
            dist/SHA256.txt
          retention-days: 30

      - name: Publish fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='v1.4: sostituito il vecchio modello Whisper recuperato dalla APK precedente con il modello Whisper tiny multilingue ufficiale attuale di sherpa-onnx. Trascrizione diretta a 16 kHz, diagnostica del livello audio e nessuna dipendenza dalla separazione delle voci. Se non viene riconosciuto testo, l app ora segnala un errore reale invece di presentare la sola intestazione come trascrizione.'
          if gh release view V1.4 >/dev/null 2>&1; then
            gh release upload V1.4 dist/Trascrivi_Offline_v1.4_FIX.apk dist/SHA256.txt --clobber
          else
            gh release create V1.4 \
              dist/Trascrivi_Offline_v1.4_FIX.apk \
              dist/SHA256.txt \
              --target main \
              --title 'Trascrivimelo v1.4 FIX modello' \
              --notes "$NOTES"
          fi
